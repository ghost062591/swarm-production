services:
  notifiarr:
    image: golift/notifiarr:latest
    hostname: notifiarr
    networks:
    - homelab
    ports:
    - "5454:5454"
    volumes:
    - /mnt/swarm-data/Notifiarr:/config
    - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
    - TZ=America/New_York
    - PUID=1000
    - PGID=1000
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.role == worker
networks:
  homelab:
    external: true