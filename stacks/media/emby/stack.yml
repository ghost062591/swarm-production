services:
  emby:
    image: lscr.io/linuxserver/emby:latest
    networks:
    - homelab
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /mnt/swarm-data/emby:/config
    - /mnt/data/media/tv:/data/tvshows
    - /mnt/data/media/movies:/data/movies
    ports:
    - 8096:8096
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8096/web/index.html" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.hostname == p4
networks:
  homelab:
    external: true
