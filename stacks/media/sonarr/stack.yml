services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    networks:
    - homelab
    ports:
    - 8989:8989
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /mnt/swarm-data/sonarr:/config
    - /mnt/data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.role == worker
networks:
  homelab:
    external: true
