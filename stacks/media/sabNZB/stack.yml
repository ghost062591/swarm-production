services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    networks:
    - homelab
    ports:
    - 8080:8080
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /home/doc/projects/swarm-data/appdata/sabnzbd:/config
    - /home/doc/projects/data/usenet:/data/usenet
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api?mode=version" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1

networks:
  homelab:
    external: true
