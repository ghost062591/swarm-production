services:
  nginx:
    image: nginx:alpine
    hostname: nginx
    networks:
      - caddy
    ports:
      - target: 80
        published: 8080
        mode: host
    deploy:
      replicas: 1
      labels:
        caddy: test.frostlabs.me
        caddy.reverse_proxy: "nginx:80"
        caddy.tls.dns: cloudflare
      restart_policy:
        condition: on-failure

networks:
  caddy:
    external: true