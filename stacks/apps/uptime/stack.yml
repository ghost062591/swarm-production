services:
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    volumes:
    - /home/doc/projects/swarm-data/appdata/uptime:/app/data
    environment:
    - TZ=America/New_York
    networks:
    - homelab
    healthcheck:
      test: [ "CMD", "node", "/app/extra/healthcheck.js" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      labels:
      - "traefik.enable=true"
      - "traefik.swarm.network=homelab"
      - "traefik.http.routers.uptime-kuma.rule=Host(`status.swarm.home)"
      - "traefik.http.routers.uptime-kuma.entrypoints=web,websecure"
      - "traefik.http.routers.uptime-kuma.tls=true
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"

networks:
  homelab:
    external: true
