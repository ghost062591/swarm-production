services:
  adminer:
    image: adminer:latest
    networks:
    - homelab
    environment:
    - ADMINER_DEFAULT_SERVER=10.0.4.10
    - ADMINER_DESIGN=nette
    - TZ=America/New_York
    healthcheck:
      test: [ "CMD", "php", "-r", "if (file_get_contents('http://localhost:8080')) exit(0); exit(1);" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      labels:
      # Local route
      - traefik.enable=true
      - traefik.swarm.network=homelab
      - traefik.http.routers.adminer.rule=Host(`miner.swarm.home`)
      - traefik.http.routers.adminer.entrypoints=web,websecure
      - traefik.http.routers.adminer.tls=true
      - traefik.http.services.adminer.loadbalancer.server.port=8080
networks:
  homelab:
    external: true 
