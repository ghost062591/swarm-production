services:
  adminer:
    image: adminer:latest
    networks:
    - homelab
    ports:
    - 8091:8080
    environment:
    - ADMINER_DEFAULT_SERVER=postgres
    - ADMINER_DESIGN=nette
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.hostname == p0
networks:
  homelab:
    external: true
