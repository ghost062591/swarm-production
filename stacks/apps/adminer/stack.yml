services:
  adminer:
    image: adminer:latest
    networks:
    - homelab
    ports:
    - 8091:8080
    environment:
    - ADMINER_DEFAULT_SERVER=10.0.4.10
    - ADMINER_DESIGN=nette
    healthcheck:
      test: ["CMD", "php", "-r", "if (file_get_contents('http://localhost:8080')) exit(0); exit(1);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
networks:
  homelab:
    external: true
