services:
  adguard:
    image: adguard/adguardhome:latest
    ports:
    - target: 53
      published: 53
      protocol: tcp
      mode: host
    - target: 53
      published: 53
      protocol: udp
      mode: host
    - target: 3000
      published: 3000
      mode: host
    volumes:
    - /home/doc/projects/swarm-data/appdata/adguard/work:/opt/adguardhome/work
    - /home/doc/projects/swarm-data/appdata/adguard/conf:/opt/adguardhome/conf
    networks:
    - homelab
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.hostname == p0
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
      labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adguard.rule=Host(`dns.home.frostlabs.me`)"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.routers.adguard.tls=true"
      - "traefik.http.routers.adguard.service=adguard"
      - "traefik.http.services.adguard.loadbalancer.server.port=3000"

networks:
  homelab:
    external: true
