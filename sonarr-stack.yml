services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    networks:
    - homelab
    ports:
    - 8989:8989
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - /home/doc/projects/swarm-data/appdata/sonarr:/config
    - /home/doc/projects/data:/data
    deploy:
      replicas: 1

networks:
  homelab:
    external: true
